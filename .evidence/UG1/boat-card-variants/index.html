<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Varianti riga barca</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f2f6fb;
        --foreground: #172b47;
        --card: #ffffff;
        --muted: #e8eef6;
        --muted-foreground: #53667d;
        --primary: #2f5fa0;
        --border: #cfdae7;
        --accent-red: #cf3a35;
        --fault: #e0a31a;
        --fault-ink: #835900;
        --off: #7b858a;
        --ok: #2f8f5b;
        --font-sans: Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 18px 16px 36px;
        background: var(--background);
        color: var(--foreground);
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      h1 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 800; }
      .sub { margin: 0 0 8px; color: var(--muted-foreground); font-size: 0.78rem; line-height: 1.4; }
      h2 {
        margin: 24px 0 2px;
        font-size: 0.7rem;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary);
      }
      h2 span {
        display: block;
        margin-top: 3px;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
        color: var(--muted-foreground);
      }
      .list { display: grid; gap: 10px; margin-top: 10px; }
      .chev { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted-foreground); }

      /* ---------- A: attuale ---------- */
      .a {
        display: flex; align-items: center; gap: 12px; min-height: 72px;
        padding: 12px; border: 1px solid var(--border); border-left-width: 4px;
        border-left-color: transparent; border-radius: 16px; background: var(--card);
        box-shadow: 0 6px 18px rgb(6 59 82 / 0.05); text-align: left; width: 100%;
      }
      .a.fault { border-left-color: var(--fault); }
      .a.off { border-left-color: var(--off); background: #edf1f7; color: var(--muted-foreground); }
      .a .mark {
        display: grid; place-items: center; width: 68px; height: 44px; flex-shrink: 0;
        border: 1px solid var(--border); border-radius: 12px; background: #f1f5fa; padding: 0 4px;
      }
      .a .mark img { max-height: 32px; max-width: 100%; object-fit: contain; }
      .a .num { flex: 1; font-size: 1.25rem; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
      .a .state { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; color: var(--muted-foreground); }
      .a.fault .state { color: var(--fault-ink); }

      /* ---------- B: marchio libero ---------- */
      .b {
        display: flex; align-items: center; gap: 14px; min-height: 72px;
        padding: 12px 14px; border: 1px solid var(--border); border-radius: 16px;
        background: var(--card); box-shadow: 0 6px 18px rgb(6 59 82 / 0.05);
        text-align: left; width: 100%;
      }
      .b .mark { width: 88px; height: 36px; flex-shrink: 0; }
      .b .mark img { width: 100%; height: 100%; object-fit: contain; object-position: left center; }
      .b .num { flex: 1; font-size: 1.5rem; font-weight: 900; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .b .state { display: flex; align-items: center; gap: 7px; font-size: 0.75rem; font-weight: 700; flex-shrink: 0; color: var(--muted-foreground); }
      .b.fault .state { color: var(--fault-ink); }
      .b .dot { width: 9px; height: 9px; border-radius: 99px; background: var(--ok); flex-shrink: 0; }
      .b.fault .dot { background: var(--fault); }
      .b.off .dot { background: var(--off); }
      .b.off { background: #edf1f7; color: var(--muted-foreground); }

      /* ---------- B2 / F: accento di stato a sinistra ---------- */
      .b.edge { border-left-width: 4px; border-left-color: var(--primary); }
      .b.edge.green { border-left-color: var(--ok); }
      .b.edge.fault { border-left-color: var(--fault); }
      .b.edge.off { border-left-color: var(--off); }
      .b .num.lead { flex: 0 0 3.25rem; }

      /* ---------- C: targa ---------- */
      .c {
        display: flex; align-items: center; gap: 12px; min-height: 72px;
        padding: 10px 12px; border: 1px solid var(--border); border-radius: 16px;
        background: var(--card); box-shadow: 0 6px 18px rgb(6 59 82 / 0.05);
        text-align: left; width: 100%;
      }
      .c .plate {
        display: grid; place-items: center; min-width: 52px; height: 52px; flex-shrink: 0;
        border-radius: 14px; background: var(--primary); color: #fff;
        font-size: 1.4rem; font-weight: 900; letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums; padding: 0 10px;
      }
      .c.fault .plate { background: var(--fault-ink); }
      .c.off .plate { background: var(--off); }
      .c.off { background: #edf1f7; color: var(--muted-foreground); }
      .c .body { flex: 1; min-width: 0; display: grid; gap: 6px; }
      .c .mark { height: 26px; }
      .c .mark img { height: 100%; max-width: 118px; object-fit: contain; object-position: left center; }
      .c .state { font-size: 0.72rem; font-weight: 700; color: var(--muted-foreground); }
      .c.fault .state { color: var(--fault-ink); }

      /* ---------- D: riga ---------- */
      .d {
        display: flex; align-items: center; gap: 14px; min-height: 68px;
        padding: 10px 14px 10px 0; border-radius: 16px; background: var(--card);
        border: 1px solid var(--border); overflow: hidden; text-align: left; width: 100%;
        box-shadow: 0 6px 18px rgb(6 59 82 / 0.05);
      }
      .d .bar { width: 6px; align-self: stretch; background: var(--ok); flex-shrink: 0; }
      .d.fault .bar { background: var(--fault); }
      .d.off .bar { background: var(--off); }
      .d.off { background: #edf1f7; color: var(--muted-foreground); }
      .d .mark { width: 96px; height: 32px; flex-shrink: 0; margin-left: 10px; }
      .d .mark img { width: 100%; height: 100%; object-fit: contain; object-position: left center; }
      .d .right { margin-left: auto; text-align: right; display: grid; gap: 2px; }
      .d .num { font-size: 1.5rem; font-weight: 900; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .d .state { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted-foreground); }
      .d.fault .state { color: var(--fault-ink); }
    </style>
  </head>
  <body>
    <h1>Riga barca &mdash; quattro trattamenti</h1>
    <p class="sub">
      Stessa flotta, stessi tre stati. I marchi sono ritagliati sul disegno e
      non pi&ugrave; su una tavola condivisa, quindi ogni marchio riempie il suo
      spazio invece di rimpicciolirsi.
    </p>
    <div id="app"></div>

    <script>
      const BOATS = [
        { type: "RS Quest", src: "rs-quest.png", n: "7", state: "clear" },
        { type: "RS Toura", src: "rs-toura.png", n: "3", state: "fault", faults: "1 avaria" },
        { type: "Laser Vago", src: "laser-vago.png", n: "14", state: "off" },
        { type: "RS 500", src: "rs-500.png", n: "2", state: "clear" },
        { type: "J/80", src: "j80.png", n: "115", state: "clear" },
        { type: "First 25.7", src: "first-25-7.png", n: "9", state: "fault", faults: "2 avarie" },
        { type: "First 27", src: "first-27.png", n: "21", state: "clear" },
      ]
      const LABEL = { clear: "Disponibile", fault: "Da controllare", off: "Non disponibile" }
      const SVG = (d) =>
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">' +
        d +
        "</svg>"
      const ICON = {
        clear: SVG('<path d="M21.8 10A10 10 0 1 1 17 3.34"/><path d="m9 11 3 3L22 4"/>'),
        fault: SVG('<path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'),
        off: SVG('<circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/>'),
      }
      const CHEV =
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
      const img = (b) => '<img alt="" src="' + b.src + '" />'
      const sub = (b) =>
        b.faults ? '<span style="display:block;font-weight:500">' + b.faults + "</span>" : ""
      const tail = (b) => (b.faults ? " · " + b.faults : "")

      const VARIANTS = [
        {
          id: "a",
          name: "A · Attuale",
          note: "Pastiglia grigia bordata attorno al marchio, numero accanto.",
          row: (b) =>
            '<div class="a ' + b.state + '">' +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="num">' + b.n + "</span>" +
            '<span class="state">' + ICON[b.state] + "<span>" + LABEL[b.state] + sub(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "b",
          name: "B · Marchio libero",
          note: "Niente pastiglia: il marchio sta sulla scheda. Stato come pallino.",
          row: (b) =>
            '<div class="b ' + b.state + '">' +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="num">' + b.n + "</span>" +
            '<span class="state"><span class="dot"></span><span>' + LABEL[b.state] + sub(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "e",
          name: "B′ · Marchio libero, icone di stato",
          note: "Come B ma con le icone vettoriali: la R06/R20 chiede una forma per stato, non solo un colore. È questa che va in produzione.",
          row: (b) =>
            '<div class="b ' + b.state + '">' +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="num">' + b.n + "</span>" +
            '<span class="state">' + ICON[b.state] + "<span>" + LABEL[b.state] + sub(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "f",
          name: "B″ · Marchio libero + accento di stato",
          note: "B′ con il filo colorato a sinistra ripreso da A: blu disponibile, ambra da controllare, grigio non disponibile. È questa che va in produzione.",
          row: (b) =>
            '<div class="b edge ' + b.state + '">' +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="num">' + b.n + "</span>" +
            '<span class="state">' + ICON[b.state] + "<span>" + LABEL[b.state] + sub(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "g",
          name: "F · Numero, marchio, stato",
          note: "Il numero apre la riga, il marchio lo segue, lo stato chiude. Stesso filo colorato a sinistra.",
          row: (b) =>
            '<div class="b edge ' + b.state + '">' +
            '<span class="num lead">' + b.n + "</span>" +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="state" style="margin-left:auto">' + ICON[b.state] + "<span>" + LABEL[b.state] + sub(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "h",
          name: "B″ verde · solo per confronto",
          note: "Lo stesso con il verde per Disponibile. In P15 il verde vuol dire Assegnata e il blu Disponibile, quindi il blu allinea le due schermate.",
          row: (b) =>
            '<div class="b edge green ' + b.state + '">' +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="num">' + b.n + "</span>" +
            '<span class="state">' + ICON[b.state] + "<span>" + LABEL[b.state] + sub(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "c",
          name: "C · Targa",
          note: "Il numero è l'eroe, in targa piena. Marchio e stato accanto.",
          row: (b) =>
            '<div class="c ' + b.state + '">' +
            '<span class="plate">' + b.n + "</span>" +
            '<span class="body"><span class="mark">' + img(b) + "</span>" +
            '<span class="state">' + LABEL[b.state] + tail(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
        {
          id: "d",
          name: "D · Riga",
          note: "Barra di stato a filo, marchio a sinistra, numero a destra.",
          row: (b) =>
            '<div class="d ' + b.state + '">' +
            '<span class="bar"></span>' +
            '<span class="mark">' + img(b) + "</span>" +
            '<span class="right"><span class="num">' + b.n + "</span>" +
            '<span class="state">' + LABEL[b.state] + tail(b) + "</span></span>" +
            CHEV +
            "</div>",
        },
      ]

      document.getElementById("app").innerHTML = VARIANTS.map(
        (v) =>
          '<section id="variant-' + v.id + '"><h2>' + v.name +
          "<span>" + v.note + "</span></h2>" +
          '<div class="list">' + BOATS.map(v.row).join("") + "</div></section>",
      ).join("")
    </script>
  </body>
</html>
