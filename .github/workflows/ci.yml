name: Deterministic verification

# Tiers (T1, owner 2026-10-21: run the full suite less often). main, manual
# runs and any push whose head commit says [full-ci] run
# the full suite; other pushes run `verify` and the browser smoke set. The
# run name says which, and scripts/ci-status.mjs reads it: milestone handoffs,
# closures and test-site publication require a full run of their commit.
run-name: "${{ (github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')) && 'Full verification' || 'Quick verification' }} · ${{ github.sha }}"

# Push only: the Pages deploy waits for a push run on main, and a pull request
# from a branch in this repository was a second, identical run (H1).
on:
  push:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress; a manual
# run has its own group, so it never cancels the push run Pages waits for.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only API access for scope selection and failed-test annotations.
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  verify:
    # Linux keeps its Chromium geometry coverage. The complete suite also runs
    # on macOS, the closest Playwright WebKit platform to Safari. The immutable
    # D2 baseline reproduces the Linux WASM compilation delay (D3 evidence).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CI_TIER: ${{ (github.event_name != 'push' || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[full-ci]')) && 'full' || 'quick' }}
      # check:docs compares frozen files (archive, changelogs, completed
      # evidence) against the previous tip, so a committed edit is caught too.
      CVC_DOCS_BASE: ${{ github.event.before }}
    steps:
      # The whole history, so check:repository can detect a pushed history
      # that brings back commits from before the 0.3.0 history rewrite
      # (AGENTS.md §13). It reports after the push; the local pre-push hook
      # (scripts/check-push.mjs) is what refuses one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Reuse a successful push of this exact commit on another branch. An
      # unknown result, a manual dispatch or a rerun executes all checks.
      - id: verified
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-status.mjs --skip-verified >> "$GITHUB_OUTPUT"
      # Frozen-file enforcement depends on this branch's previous tip, even
      # when the same commit's code has already passed elsewhere.
      - if: steps.verified.outputs.verified == 'true'
        run: node scripts/check-docs.mjs
      - if: steps.verified.outputs.verified != 'true'
        run: npm ci
      # A push that touches only documentation, evidence, milestone metadata or
      # agent definitions, on a previous tip whose CI passed, runs `verify`;
      # anything else runs `verify:all` (scripts/ci-scope.mjs).
      - id: scope
        if: steps.verified.outputs.verified != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"
      # Anything but an explicit "false", an empty output included, runs
      # everything.
      - if: steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false' && matrix.os == 'macos-15'
        run: npx playwright install --with-deps chromium webkit
      - if: steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false' && matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - name: Complete deterministic suite, including all browser projects
        if: steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false' && matrix.os == 'macos-15' && env.CI_TIER == 'full'
        run: npm run verify:all
      - name: Linux deterministic checks and Chromium layout and storage projects
        if: steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false' && matrix.os == 'ubuntu-latest' && env.CI_TIER == 'full'
        run: |
          npm run verify
          npm run check:full-week
          npm run check:ocr-offline
          npm run verify:e2e -- --project=pixel-7-chrome --project=iphone-13-viewport --project=desktop-chrome-storage
      - name: Quick tier, deterministic checks and the browser smoke set
        if: steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false' && env.CI_TIER == 'quick'
        run: |
          npm run verify
          if [ "${{ matrix.os }}" = "macos-15" ]; then
            npm run verify:e2e:smoke -- --project=pixel-7-chrome --project=iphone-13-webkit-core
          else
            npm run verify:e2e:smoke -- --project=pixel-7-chrome
          fi
      - if: steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser == 'false'
        run: npm run verify
      # Keep per-case timings and project coverage even when every test passes.
      - name: Keep browser timing and coverage report
        if: always() && steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/e2e-report.json
          retention-days: 14
          if-no-files-found: ignore
      # Tests that passed only on a retry: kept even when the run is green.
      - if: always() && steps.verified.outputs.verified != 'true' && steps.scope.outputs.browser != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flaky-${{ matrix.os }}-${{ github.run_id }}
          path: test-results/e2e-flaky.json
          retention-days: 30
          if-no-files-found: ignore
      # playwright.config.ts already keeps a trace on failure, but nothing ever
      # collected it, so a failure that only happens on this runner could be
      # read solely through the truncated annotation text. That is how the
      # ug1-duty-reflow click failure stayed undiagnosed. Keep the trace and the
      # report so the next one can be opened instead of guessed at.
      # A passed retry must not discard the first attempt's retained trace.
      - if: failure() || hashFiles('test-results/**/trace.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ matrix.os }}-${{ github.run_id }}
          # Traces, screenshots and failure context only: a public repository
          # must not publish whatever else a run writes (UG3 review SP-UG3-Q3).
          path: |
            test-results/**/trace.zip
            test-results/**/*.png
            test-results/**/error-context.md
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
