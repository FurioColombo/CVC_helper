name: D3 initialization diagnostic (not acceptance)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        source: [D3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable application source and identical acceptance harness
        env:
          SOURCE: ${{ matrix.source }}
          PROBE_SHA: ${{ github.sha }}
        run: |
          if [ "$SOURCE" = D2 ]; then
            git checkout d033bbfe172d80166c280a363841fed3fe1e9476
          else
            git checkout 0a485f68b6e5be50bbe93076ec4ed9afe987d845
          fi
          git show "$PROBE_SHA:src/test/d1MigrationHarness.ts" > src/test/d1MigrationHarness.ts
          git show "$PROBE_SHA:tests/e2e/d1-migration.spec.ts" > tests/e2e/d1-migration.spec.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Same five-second upgrade and reopen acceptance, without worker wrapper
        run: npm run verify:e2e -- tests/e2e/d1-migration.spec.ts --project=iphone-13-webkit-core --grep="upgrades and reopens a 40-student" --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-platform-${{ matrix.os }}-${{ matrix.source }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
