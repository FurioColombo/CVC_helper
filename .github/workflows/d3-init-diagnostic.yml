name: D3 DOM baseline candidate (not acceptance)
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  image:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Immutable failed source with only DOM-baseline candidate
        run: |
          probe_sha=$(git rev-parse HEAD)
          git checkout 33ac7c927d602d9f322c55ab83e981f0a7651b06
          git show "$probe_sha:src/lib/pageSnapshot.ts" > src/lib/pageSnapshot.ts
          git show "$probe_sha:src/lib/pageSnapshot.test.ts" > src/lib/pageSnapshot.test.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run src/lib/pageSnapshot.test.ts
      - run: npx playwright install --with-deps chromium webkit
      - name: Original enlarged-text comparisons and image negative controls
        env:
          CVC_REVIEW_DIR: test-results/image-pairs
        run: npm run verify:e2e -- tests/e2e/f3-crew-summary.spec.ts tests/e2e/ug2-hostile-roster.spec.ts tests/e2e/f3-duty-summary.spec.ts --project=pixel-7-chrome --project=iphone-13-webkit-core --grep="copies double names|shows and copies the hostile|copies the 13-crew summary|shows a readable Comandate summary" --retries=0 --output=test-results/image-cases
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-dom-baseline-${{ github.run_id }}
          path: test-results/
          retention-days: 7
          if-no-files-found: error
