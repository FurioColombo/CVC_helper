name: D3 initialization diagnostic (not acceptance)
on:
  push:
    branches: ["codex/d3-init-probe-*"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Measure unchanged five-second acceptance with extra stages
        run: npm run verify:e2e -- tests/e2e/d1-migration.spec.ts --project=iphone-13-webkit-core --grep "upgrades and reopens a 40-student course" --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-init-stages
          path: |
            test-results/**/migration/large-upgrade-*.json
            test-results/e2e-report.json
          retention-days: 7
