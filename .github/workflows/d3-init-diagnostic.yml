name: D3 initialization diagnostic (not acceptance)
on:
  push:
    branches: ["codex/d3-init-probe-*"]
permissions:
  contents: read
jobs:
  diagnose:
    name: Initialize (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: same-page
            pattern: "upgrades and reopens a 40-student course"
          - variant: fresh-direct
            pattern: "reopens a 40-student upgrade directly from a fresh document"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Measure unchanged five-second acceptance with extra stages
        run: npm run verify:e2e -- tests/e2e/d1-migration.spec.ts --project=iphone-13-webkit-core --grep "${{ matrix.pattern }}" --retries=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d3-init-stages-${{ matrix.variant }}
          path: |
            test-results/**/migration/large-upgrade-*.json
            test-results/e2e-report.json
          retention-days: 7
