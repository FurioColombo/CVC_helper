name: D3 update-startup diagnostic
on:
  push:
    branches: [codex/d3-update-startup-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        mode: [observe, idempotent]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: a4ff839965e428712b1d819538bf0b74b8efa2e3
      - name: Overlay diagnostic observations only
        env:
          PROBE_COMMIT: ${{ github.sha }}
          MODE: ${{ matrix.mode }}
        run: |
          git show "$PROBE_COMMIT:scripts/check-update-journey.mjs" > scripts/check-update-journey.mjs
          git show "$PROBE_COMMIT:src/persistence/waSqliteFactory.ts" > src/persistence/waSqliteFactory.ts
          git show "$PROBE_COMMIT:.github/diagnostics/engineWorkerRegistration.$MODE.ts" > src/persistence/engineWorkerRegistration.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check:update
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-startup-${{ matrix.mode }}-${{ github.run_id }}
          path: test-results/
          retention-days: 14
