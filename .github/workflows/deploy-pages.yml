name: Deploy to GitHub Pages

# The app is local-first and has no backend, so "deploying" is publishing a
# folder of static files. V01 measured that it needs no cross-origin isolation,
# so a host that cannot set headers — which GitHub Pages cannot — is fine.
#
# A project site serves from /<repo>/, so the build is given that base path.
# Nothing else about the build changes.

# Only main, and only a commit whose deterministic verification passed: the
# deploy waits for the CI workflow on main and publishes exactly the commit it
# verified. Three phone-test deploys once went live from commits whose CI had
# failed. The github-pages environment allows the default branch alone, so a
# run from any other branch would be refused at the publish step anyway.
# workflow_dispatch stays for a deliberate manual republish of main.
on:
  workflow_run:
    workflows: ["Deterministic verification"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a newer push win rather than queueing behind an
# older one that is about to be superseded.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build for the project subpath
        # github.repository is always "owner/name"; take the name from it rather
        # than from the event payload, which is not guaranteed to carry a
        # repository object. An empty base here would build a root site and
        # every asset would 404 under /<repo>/ — a silent, confusing failure.
        run: |
          set -euo pipefail
          base="${GITHUB_REPOSITORY##*/}"
          test -n "$base"
          echo "Building for base /$base/"
          CVC_BASE_PATH="$base" npm run build
          grep -q "\"scope\":\"/$base/\"" dist/manifest.webmanifest
      - run: npx playwright install --with-deps chromium
      - name: Prove the published build works offline at its subpath
        run: |
          set -euo pipefail
          base="${GITHUB_REPOSITORY##*/}"
          CVC_BASE_PATH="$base" npm run check:ocr-offline
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
