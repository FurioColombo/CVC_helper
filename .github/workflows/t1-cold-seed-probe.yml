name: T1 cold seed lifecycle A/B (diagnostic only)

on:
  push:
    branches:
      - codex/t1-cold-seed-probe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-webkit:
    name: Fresh-process paired WebKit diagnostic (not acceptance)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Keep app, fixtures, tests and canonical options frozen
        run: git diff --exit-code bbaf8ea87701b79de2642aeb8e209d9e284808cf -- src tests public package.json package-lock.json vite.config.ts vite.engine-startup.ts playwright.config.ts
      - run: npm ci
      - run: npx playwright install webkit
      - name: Compare sixteen original-bound cases without retries
        run: node scripts/probes/t1-cold-seed-lifecycle.mjs "$GITHUB_WORKSPACE"
      - name: Retain all measured outcomes and failed-case diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-cold-seed-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            scripts/probes/results.json
            scripts/probes/traces/
            scripts/probes/screenshots/
          retention-days: 14
          if-no-files-found: warn
